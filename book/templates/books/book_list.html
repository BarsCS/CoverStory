{% extends "base.html" %}
{% load static %}
{% block title %}Books{% endblock title %}

{% block head %}
<script src="{% static "js/listbooks.js" %}" defer></script>
{% endblock head %}

{% block content %}
<div class="filter-parent">
    <div class="filter">
        {% for genre in genres %}
            <a href="{% querystring genre=genre.slug %}" class="genre"> {{genre.name}} </a>
        {% endfor %}
        <a href="{% querystring genre=None %}" class="genre">Clear</a>
    </div>
</div>

<div class="parent-books-list">
    <div class="books-list">
        {% include "./list.html" %}
    </div>
</div>
{% endblock content %}
